# ======================================================
# Docker Compose：FastAPI + MySQL + Nginx
# ======================================================
#   docker-compose up -d
#   docker-compose logs -f app
#   docker-compose down

version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: copy_generator_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: copy_generator
      MYSQL_USER: copygen
      MYSQL_PASSWORD: copygen123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucopygen", "-pcopygen123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: copy_generator_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: copygen
      MYSQL_PASSWORD: copygen123
      MYSQL_DATABASE: copy_generator
      DATABASE_URL: ""
      CHROMA_PERSIST_PATH: /app/data/chroma
      LOG_FILE_PATH: /app/logs/app.log
    expose:
      - "8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: copy_generator_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - app_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  app_data:
  app_logs:
