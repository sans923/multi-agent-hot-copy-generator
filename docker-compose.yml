# ======================================================
# Docker Compose：FastAPI + MySQL + Nginx
# ======================================================
#   docker-compose up -d
#   docker-compose logs -f app
#   docker-compose down

services:
  mysql:
    image: mysql:8.0
    container_name: copy_generator_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-copy_generator}
      MYSQL_USER: ${MYSQL_USER:-copygen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: copy_generator_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-copygen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-copy_generator}
      DATABASE_URL: ""
      CHROMA_PERSIST_PATH: /app/data/chroma
      LOG_FILE_PATH: /app/logs/app.log
    expose:
      - "8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: copy_generator_worker
    restart: unless-stopped
    command: ["python", "scripts/task_worker.py"]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-copygen}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-copy_generator}
      DATABASE_URL: ""
      CHROMA_PERSIST_PATH: /app/data/chroma
      LOG_FILE_PATH: /app/logs/worker.log
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: copy_generator_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - app_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  app_data:
  app_logs:
