# ======================================================
# Nginx 配置文件
# ======================================================
# 角色：反向代理
# 
# 为什么需要 Nginx？（面试加分点）
# 1. 静态资源服务：直接由 Nginx 返回，不经过 Python（快10倍）
# 2. SSL 终止：HTTPS 握手在 Nginx 层处理，Python 应用只处理 HTTP
# 3. 请求限速：防止恶意用户刷接口（限制每IP每秒的请求数）
# 4. 负载均衡：可以把请求分发给多个 Python 进程（水平扩展）
# 5. 连接缓冲：Nginx 先把响应缓存起来，避免慢客户端占用 Python 连接

user nginx;
worker_processes auto;  # 自动根据 CPU 核数设置 worker 数量
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;  # 每个 worker 最多处理 1024 个并发连接
    use epoll;                # Linux 下用 epoll，高效事件驱动
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式（包含响应时间，方便性能分析）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile        on;   # 零拷贝文件传输
    tcp_nopush      on;   # 批量发送响应头
    tcp_nodelay     on;   # 禁用 Nagle 算法，降低延迟
    keepalive_timeout 65;
    gzip on;              # 启用 Gzip 压缩（JSON响应压缩率60-80%）
    gzip_types text/plain application/json application/javascript text/css;

    # ====================================================
    # 限速配置（防刷接口）
    # ====================================================
    # 按客户端 IP 限速，每秒最多 10 个请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ====================================================
    # 上游服务（FastAPI 应用）
    # ====================================================
    upstream fastapi_app {
        server app:8000;          # Docker Compose 中 app 服务的 8000 端口
        keepalive 32;             # 保持 32 个长连接，减少连接建立开销
    }

    # ====================================================
    # HTTP 服务（强制跳转 HTTPS）
    # ====================================================
    server {
        listen 80;
        server_name _;  # 匹配所有域名，生产环境改为你的域名

        # 健康检查接口不重定向（用于负载均衡探活）
        location /health {
            proxy_pass http://fastapi_app;
        }

        # 其他 HTTP 请求跳转到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ====================================================
    # HTTPS 主服务
    # ====================================================
    server {
        listen 443 ssl http2;
        server_name your-domain.com;  # 替换为你的域名

        # SSL 证书（火山引擎免费SSL证书）
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # 请求体大小限制（上传文档用）
        client_max_body_size 10M;

        # 代理超时（Agent执行可能需要60秒以上）
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;  # 3分钟，留足Agent执行时间
        proxy_send_timeout    30s;

        # 代理头（把客户端真实 IP 传给 FastAPI）
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- API 接口 ----
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;  # 允许突发20个请求
            proxy_pass http://fastapi_app;
        }

        # ---- Swagger 文档（生产环境可以关闭，加 allow/deny 限制IP）----
        location /docs {
            # allow 你的IP;
            # deny all;
            proxy_pass http://fastapi_app;
        }

        location /redoc {
            proxy_pass http://fastapi_app;
        }

        location /api/openapi.json {
            proxy_pass http://fastapi_app;
        }

        # ---- 健康检查（不限速）----
        location /health {
            proxy_pass http://fastapi_app;
        }

        # ---- 根路径 ----
        location / {
            proxy_pass http://fastapi_app;
        }
    }
}
